function vEd(){const c=calc({l:ed.l,p:{}});
const secs=[0,1,2].map(t=>{const rows=ed.l.map((x,k)=>({x,k,i:IM()[x[0]]})).filter(r=>r.i&&r.i[1]===t);return `<h3>${TY[t]}</h3>`+rows.map(r=>`<div class="card"><div class="rw"><div>${esc(r.i[2])}<div class="mu">${esc(r.i[3])} × ${f(price(r.i))}</div></div><button class="x" data-a="edrm" data-k="${r.k}">✕</button></div>${ed.pj?`<div class="g2"><label>Cantidad / rendimiento<input inputmode="decimal" value="${r.x[1]}" data-i="edq" data-k="${r.k}"></label><label>Precio (Bs)<input inputmode="decimal" value="${price(r.i)}" data-i="edp" data-id="${esc(r.i[0])}"></label></div>`:`<label>Cantidad<input inputmode="decimal" value="${r.x[1]}" data-i="edq" data-k="${r.k}"></label>`}</div>`).join('')+`<button class="btn sec" data-a="edadd" data-t="${t}">＋ Agregar ${TY[t].toLowerCase()}</button>`}).join('');
return `<button class="btn sec" data-a="edcancel">← Cancelar</button>${ed.pj?`<div class="card mu">Estás ajustando este APU <b>solo para el proyecto “${esc(U.proj||'sin nombre')}”</b>. El catálogo general no cambia.</div>`:''}<div class="card"><label>Código<input value="${esc(ed.c)}" data-i="edc"${ed.cat||ed.pj?' readonly':''}></label><label>Descripción<input value="${esc(ed.d)}" data-i="edd"></label><div class="g2"><label>Unidad<input value="${esc(ed.u)}" data-i="edu"></label><label>Módulo<select data-i="edm"><option value="">—</option>${D.mods.map(m=>`<option value="${m[0]}"${ed.m===m[0]?' selected':''}>${esc(m[1])}</option>`).join('')}</select></label></div><div class="big" id="edt">${f(c.t)} Bs</div></div>`+secs+`<button class="btn" data-a="edsave">Guardar${ed.pj?' ajuste en este proyecto':' APU'}</button>${ed.pj&&(CP().ae||{})[ed.o]?'<button class="btn sec" data-a="pdel">Volver al APU original</button>':''}`}

return `<h3>Empresa (para el PDF)</h3><div class="card"><label>Nombre de la empresa<input value="${esc(U.co.n)}" data-i="con"></label><label>Dirección / teléfono (un renglón por línea)<textarea rows="3" data-i="cos">${esc(U.co.s)}</textarea></label>${U.co.logo?`<img src="${U.co.logo}" style="max-height:70px;max-width:100%;margin-top:8px;display:block">`:''}<label>Tipo de cambio (Bs por USD)<input inputmode="decimal" value="${esc(U.tc)}" data-i="ctc"></label><label>Logo de la empresa (imagen)<input type="file" accept="image/*" data-i="logo"></label>${U.co.logo?'<button class="btn sec" data-a="nologo">Quitar logo</button>':''}</div><h3>Porcentajes generales</h3><div class="card">${L.map(x=>`<label>${x[1]} (%)<input inputmode="decimal" value="${+(U.par[x[0]]*100).toFixed(4)}" data-i="par" data-id="${x[0]}"></label>`).join('')}<div class="mu" style="margin-top:8px">Los APU con porcentaje propio (p. ej. ACE001) conservan el suyo.</div></div><button class="btn sec" data-a="parrst">Restaurar porcentajes de partida</button><h3>Respaldo</h3><div class="card"><div class="mu">Tus datos se guardan solo en este navegador. Para pasarlos a otro equipo, exportá el texto y pegalo allá en Importar.</div><textarea id="bk" rows="5" placeholder="Acá aparece el respaldo o pegá uno para importar"></textarea><div class="g2"><button class="btn" data-a="exp">Exportar</button><button class="btn sec" data-a="imp">Importar</button></div><div class="mu">Último respaldo: ${U.lb?new Date(U.lb).toLocaleDateString('es'):'nunca'}</div><button class="btn" data-a="bkdl">Descargar respaldo como archivo</button><label>Importar respaldo desde archivo<input type="file" accept=".json,application/json" data-i="bkf"></label></div><button class="btn dg" data-a="rst">Borrar mis datos</button><div class="card mu">Precios, jornales y rendimientos son valores de partida: validalos antes de cotizar. Beneficios sociales de 15% es un valor bajo para Bolivia: revisalo.</div>`}
